services:
  postgres:
    # 默认仍是官方 postgres:16-alpine。它与之前出问题的 autumn27/artex 是同一类
    # 依赖（Docker Hub 单一来源）。想彻底脱离 Docker Hub，在 .env 里设：
    #   POSTGRES_IMAGE=ghcr.io/darkkid0/artex:postgres-16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    # 该镜像已推送并验证：匿名可拉、与官方 11 层逐字节一致。细则见 DEPLOY-custom.md。
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 镜像名可经 .env 覆盖（ARTEX_IMAGE / ARTEX_TAG）。
    #
    # 默认值指向**本地构建产物** `artex:custom`，由 ./build-image.sh 生成，
    # 基础镜像来自我们自己的公开镜像 ghcr.io/darkkid0/artex:base。
    # 官方原版写的是 `autumn27/artex:${ARTEX_TAG:-latest}`，但该 Docker Hub
    # 仓库已下线（返回 404），保留会让任何新机在 `docker compose pull` 直接失败。
    #
    # 想直接用预构建镜像：在 .env 里设 ARTEX_IMAGE=ghcr.io/darkkid0/artex。
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-custom}
    # 本地构建产物（artex:custom）已在本机 → 直接用，不去 registry 找；
    # 若 .env 把 ARTEX_IMAGE 指到 ghcr.io 且本机没有 → 自动拉取。两种用法都成立。
    pull_policy: ${ARTEX_PULL_POLICY:-missing}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
